      value: 18790

    # Gateway binding mode
    gateway-bind:
      type: string
      value: lan

    # Docker image
    openclaw-image:
      type: string
      value: alpine/openclaw:2026.2.1

    # Default Ollama model to use
    ollama-default-model:
      type: string
      value: llama3.3

